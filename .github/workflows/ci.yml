name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hiro2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          python-version: "3.13"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"

      - name: Sync Python dependencies
        run: uv sync --frozen --all-groups

      - name: Sync Web dependencies when present
        run: |
          if [ -f apps/web/package.json ]; then
            pnpm --dir apps/web install --frozen-lockfile
          fi

      - name: Verify formatting, static checks and tests
        run: make verify

      - name: Run Git hooks on all tracked files
        run: uv run pre-commit run --all-files
