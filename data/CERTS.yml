# 学练赛证"证"段映射词典（证书 <-> 能力域，仿 SKILLS.yml 模式）。
# 来源三通道 + 讯飞认证卡（调研结论 docs/research/xlzsz-channels.md）：
#   osta    人社部国家职业标准（cert_id=osta-std-<职业编码>，raw 数据 certget.py 可复现）
#   onex    教育部 1+X 职业技能等级证书（cert_id=onex-<certificateId>；实测 API 数据中
#           无讯飞 AI 证书，讯飞认证另列 aidaxue 源）
#   huawei  华为职业认证（cert_id=hw-<name小写>）
#   aidaxue 讯飞 AI 大学堂认证（SPA DOM 提取，官方页 https://www.aidaxue.com/certification）
# 映射规则（capability_ids 可多值；level_scale 为证书等级 -> 岗位等级的换算声明）：
#   每条证书登记 capability_ids + evidence_url + effective_from（颁发/发布时间，
#   天然适配时间闸门）。简历解析命中证书 mention 时，经本表反查 capability_ids，
#   匹配引擎按"已具备（证书证据）"判定，证据 = 证书名。
# 人工审定规则：厂商认证映射参考官方 introduction 文本；osta 标准映射参考
#   certparse 产物的工作要求表（data/processed/certs/std-requirements/）。

version: 1

level_scale:
  # 证书等级 -> 岗位等级（L1 初级 / L2 中级 / L3 高级）换算声明
  osta_engineer: {初级: L1, 中级: L2, 高级: L3}
  osta_skilled: {五级/初级工: L1, 四级/中级工: L1, 三级/高级工: L2, 二级/技师: L3, 一级/高级技师: L3}
  onex: {初级: L1, 中级: L2, 高级: L3}
  huawei: {hcia: L1, hcip: L2, hcie: L3}
  aidaxue: {专项: L1}

certs:
