    capability_ids: [cap_01, cap_03, cap_04, cap_05, cap_06, cap_10]
    level_type: osta_engineer
    effective_from: '2021-09-29'
    evidence_url: https://www.osta.org.cn/skillStandard
    notes: 国家职业技术技能标准；工作要求覆盖初/中/高三级（std-requirements 已结构化 124 工作内容）

  - cert_id: osta-std-4-04-05-05
    name: 人工智能训练师
