# 学练赛证"赛"段映射词典（竞赛 <-> 能力域 + 获奖等级换算，仿 SKILLS.yml 模式）。
# 来源：
#   cahe      中国高等教育学会全国普通高校大学生竞赛目录（无 API，官方新闻稿人工整理）
#   xfyun     讯飞AI开发者大赛（challenge.xfyun.cn 公开 API，raceget.py 全量 629 场可复现）
#   tianchi   阿里天池（270 场全量入库，tags 技能标签）
#   datafountain DataFountain（300 场全量入库，tags 技能标签）
# 精选原则：每能力域 2~4 场代表性赛事；全量赛事在 data/processed/races/race-catalog.jsonl，
#   本表只登记映射与等级换算声明（映射人工审定，竞赛元数据以目录为准）。
# award_to_level：获奖等级 -> 岗位等级换算（用于竞赛经历的能力判定证据）。

version: 1

award_to_level:
  # scale x award -> L 档；同 scale 未列出的奖项默认 L1
  cahe: {国家级一等奖: L3, 国家级二等奖: L2, 国家级三等奖: L2, 省级一等奖: L2, 省级二等奖: L1}
  enterprise: {冠军: L3, 亚军: L2, 季军: L2, 一等奖: L2, 二等奖: L1, 入围决赛: L1}

# ---- race-catalog 全量赛事的能力域映射规则（时间维度打通用）----
# race-catalog.jsonl 的赛事只有 industry（讯飞）/tags（天池、DF），无 capability_ids；
# 用以下规则推导能力域，供"正在报名赛事"推荐。未命中的赛事不进入推荐（不硬套）。
industry_rules:
  计算机视觉: [cap_05, cap_12]
  数据挖掘: [cap_09, cap_12]
  自然语言处理: [cap_01, cap_12]
  语音技术: [cap_05]
  多模态技术: [cap_05]
  大模型技术: [cap_01, cap_03]
  大模型应用: [cap_01, cap_04]
  大模型场景应用: [cap_01]
  Skill技能开发: [cap_04, cap_02]
  企业数字化: [cap_15, cap_18]
  数字化: [cap_18]
  企业服务: [cap_14, cap_15]
  硬科技: [cap_17]
  制造: [cap_16, cap_17]
  工业制造: [cap_16, cap_17]
  先进智造: [cap_16, cap_17]
  智慧城市: [cap_16]
  创新生活: [cap_16]
  生活: [cap_16]
  元宇宙: [cap_05]
  文创娱乐: [cap_05]
  学习: [cap_24]
  办公: [cap_04]
  新基建: [cap_13, cap_16]
  新质生产力: [cap_01]

tag_rules:
  自然语言处理: [cap_01, cap_12]
  大语言模型: [cap_01]
  LLM: [cap_01]
  计算机视觉: [cap_05, cap_12]
  数据挖掘: [cap_09, cap_12]
  AI其他: [cap_12]
  回归预测: [cap_12]
  人工智能: [cap_12]
  文本预处理: [cap_01, cap_10]
  文本分类: [cap_01, cap_12]
  文本摘要: [cap_01]
  情感分析: [cap_01]
  关系抽取: [cap_01, cap_12]
  目标检测: [cap_05, cap_12]
  图像分类: [cap_05, cap_12]
  图像分割: [cap_05, cap_12]
  多模态: [cap_05]
  智能体: [cap_04]
  微调大模型: [cap_03]
  异常检测: [cap_12]
  知识图谱: [cap_06, cap_08]
  区块链: [cap_08]
  连接分析: [cap_09]
  性能优化: [cap_15, cap_18]
  安全: [cap_19, cap_30]
  金融: [cap_21]
  医疗健康: [cap_21]
  电商: [cap_21]

contests:
