# PyPI 包 -> 能力域信号映射（正式版 v9，209 包 / 18 域 + npm 24 包 / 5 域）。
# 扩容方法链（四轮，2026-08-28~29，均含取舍规则）：
#   v6 JD 高频英文技能原词反查 + hugovk top-15000 下载 dump 域词根扫描（+62：
#      ollama/browser-use/sglang/mem0ai/Databricks 系等；剔除主包拆包与传递依赖——
#      langchain-openai 等是传递结构、typing-extensions 等是依赖不是技能）；
#   v7 中文 AI 生态（+28：dashscope/modelscope/qwen-agent/flagembedding/paddlepaddle/
#      mineru 等中文岗位市场直接信号 + 评测观测 5 包 + 可视化/数据工程/云补齐）；
#   v8 gh search 14 个 AI topic x star（+10：opik 285 万/月、ocrmypdf、whisperx、
#      scrapling、open-webui、funasr、lightrag-hku、cognee、astrbot、llamafactory）；
#   v9 agent 域专项 15 topic 宽检索（+11：graphiti-core 110 万/月、pipecat 语音 agent
#      121 万、agentscope 67 万、kedro 112 万、langflow、gpt-researcher、praisonai、
#      qwenpaw、pocketflow、metagpt、serena；cap_04 域达 37 包——主案例域密度）。
#   star 榜与下载榜差集分类法：被低估包（加）vs git-clone 型项目（GPT-SoVITS/
#      CosyVoice/Langchain-Chatchat/storm/superagi 等月下载 <3000，pip 非主通路，不加）。
# 数据通路（2026-08-28~29 实测）：
#   下载历史主通路 = ClickHouse 官方 Playground pypi.pypi_downloads_per_month（`ch`
#     子命令，sql-clickhouse.clickhouse.com demo 免费，2016-01 起 127 个月一条 SQL；
#     口径与 BigQuery Linehaul 逐位交叉验证一致 torch 2018-01=9502；BigQuery `hist`
#     为备份通路）。npm = downloads/range API（2015 起全历史）；pepy.tech 90 天滚动
#     （key 在 .env）；萌芽锚点 = pypi.org JSON API 全版本 upload_time（`rels`）。
#   已死通路：pypistats 全端点仅 180 天；GitHub stargazers 列表端点 2026-06-30 起
#     仅限仓库管理员（但 gh search repos 可用于包发现）。
# 信号口径：域月度下载份额（当月该域 / 当月同生态受监控包总量）首次 >= share_onset
#   且其后累计 >= sustain；按月归一对消生态级下载通胀（绝对量阈值已证伪）。
#   份额口径绑定映射表版本：改表全量重拉（ClickHouse 通路成本近零）。
# limitation：国内 pip 走镜像源使官方下载低估中国使用且包间不均匀（xinference 纯国内
#   流行项目官方下载近零为实证）；2016 前无数据（老域标左删失）；词典 30 域无前端域，
#   React/TypeScript 等 JD 高频前端技能不做包映射；Scala/Go/Rust 非 Python 生态不覆盖。

version: 9
share_onset: 0.02
sustain: 0.3
min_monthly_downloads: 10000

