# PyPI 包 -> 能力域信号映射（正式版 v6，160 包 / 19 域 + npm 24 包 / 5 域，9/1 拉数前定稿）。
# 补包依据（2026-08-28）三层：JD 语料高频英文技能原词反查（Databricks 250 次/Kafka 116 等）
#   -> hugovk top-15000 月度下载 dump 按域词根扫描（发现 ollama/browser-use/sglang 等增长型遗漏）
#   -> 人工判定剔除主包拆包（langchain-*/langgraph-checkpoint 等传递结构）与传递依赖
#   （typing-extensions/botocore/opentelemetry-* 是依赖不是技能）。
# 数据通路（2026-08-28 实测）：
#   PyPI 下载历史 = BigQuery 公共数据集 bigquery-public-data.pypi.file_downloads（Linehaul 原始日志），
#     2018-01 起全历史月度聚合，实测扫描 324GB / 免费额度 1TB 每月；扫描量只随月数增长、与包数无关。
#   npm 下载历史 = api.npmjs.org /downloads/range（2015-01 起，18 个月一段，无 key 免费实测可用）；
#     npm 份额独立分母（PyPI/npm 两生态不混算），AI SDK JS 版与 PyPI 同域对照。
#   萌芽锚点 = pypi.org JSON API 全版本 upload_time（scripts/pypidl.py rels）。
#   已死通路：pypistats 全端点仅 180 天；GitHub stargazers 端点 2026-06-30 起仅限仓库管理员。
# 信号口径：域月度下载份额（当月该域 / 当月同生态受监控包总量）首次 >= share_onset 且其后累计 >= sustain。
#   份额按月归一对消生态级下载通胀（CI/bot/传递安装逐年上涨，绝对量阈值已证伪）。
#   份额口径绑定映射表版本：改表即全量重拉（PyPI 侧 324GB），故拉数前定稿，后续扩容递增 version 并重跑。
# limitation：国内 pip 走镜像源使官方下载低估中国使用且包间不均匀；2018 前无 PyPI 数据（老域标左删失）；
#   词典 30 域无前端域，React/TypeScript 等 JD 高频前端技能不做包映射（硬映射造脏数据，留词典扩展）；
#   Scala/Go/Rust 为非 Python 生态（JVM/modules/cargo），超出本表范围。

version: 6
share_onset: 0.02
sustain: 0.30
min_monthly_downloads: 10000

