    name: LLM应用
    aliases:
      [LLM, 大语言模型, 大模型, 基座模型, 长上下文, 上下文窗口, 百万上下文, 快速模型, 端侧模型, 生成式 AI, 生成式AI, AIGC, 生成式人工智能, 无代码, 低代码, no-code]
