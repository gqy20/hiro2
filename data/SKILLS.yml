# 技能归一化词典（D4）。确定性规则匹配，不经 LLM。
# 结构：capability_id 对应 Excel 能力矩阵（data/processed/capability-matrix/capabilities.json），
#       aliases 是原文提及词的变体表，points 是能力域下的技能点。
# 未命中的提及进入新词队列；语料习得的别名进 SKILLS-EARNED.yml（带 effective_from，受 as_of 闸门控制）。
# 反复出现的新词经人工审核后进入两个文件之一并递增 version。

version: 5

entries:
