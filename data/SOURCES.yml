# 原始数据来源登记（D0）。字段与 docs/contracts.md 的 Evidence/FeedSource 对齐。
# ingestion_mode: backfill 表示历史回填，available_at 以发布时间为准，不能伪装实时采集。

sources:
  - id: capability-matrix
    type: expert_matrix          # 职业标准/Excel：能力本体与专家基线
    path: data/raw/capability-matrix
    license: 团队内部整理，仅限比赛与研究使用
    time_range: [2026-08-19, 2026-08-19]
    ingestion_mode: backfill
    notes: 数字经济岗位能力矩阵，46 岗位 x 30 能力 x 7 分组，0-5 评分

  - id: arxiv
    type: academic_preprint     # arXiv 预印本：技术先导信号的最上游
    path: data/raw/arxiv
    license: arXiv 公开 metadata（CC BY），仅限研究使用
    time_range: [2015, 2026]
    ingestion_mode: backfill
    notes: export.arxiv.org API 按 13 个技能关键词 x 12 年拉取 14830 篇
      （标题/摘要/分类/提交日期），词典归一聚合月 x 能力域；
      与 relsignal 的包/日报/JD 三层并排构成四层时间轴

  - id: jd-opencli
    type: job_board              # 招聘 JD：企业岗位需求验证
    path: data/raw/jd/opencli
    license: 招聘平台公开页面，仅限研究使用，不分发原文
    time_range: [2025-09, 2026-07]
    ingestion_mode: backfill
    notes: 关键词“AI 工程师”；搜索层 1190 条（51job 650 / boss 540），详情层 70 条，正文可用约 38 条

  - id: jd-archive
    type: web_archive          # Wayback Machine 历史快照：回溯 2022~2025 真实岗位池
    path: data/raw/jd/archive
    license: Internet Archive 公开快照，仅限研究使用，不分发原文
    time_range: [2022-01, 2025-05]
    ingestion_mode: backfill
    notes: CDX 枚举字节/腾讯招聘 API 的全部 200 快照（搜索响应逐份拉取），
      记录带 snapshot_ts 观测时间锚点；jdxtract 按 jd_id 首见去重（最早观测优先）

  - id: jd-corp
    type: employer_site          # 企业官方招聘站：结构化 JD 与真实发布时间
    path: data/raw/jd/corp
    license: 企业招聘官网公开页面，仅限研究使用，不分发原文
    time_range: [2026-01, 2026-08]
    ingestion_mode: live
    notes: 三站 13 关键词 x3 页共 682 条——字节 jobs.bytedance.com 376 条（Playwright
      拦截同源 XHR，职责/要求正文+毫秒发布时间）、阿里 talent-holding 98 条
      （POST /position/search，含学历与年限区间）、腾讯 careers.tencent.com 208 条
      （GET /tencentcareer/api/post/Query 纯 HTTP）；均无登录/WAF 对抗，限速页间 2~4s

  - id: standards
    type: occupation_standard    # 官方职业标准：能力本体参考
    path: data/raw/standards
    license: 各来源官方许可，仅限研究使用
    time_range: [2022, 2026]
    ingestion_mode: backfill
    notes: 中国职业分类 2022 征求意见稿 PDF、O*NET 30.3 文本、ESCO v1.2.1 职业页

  - id: wechat-mp
    type: industry_media         # 中文产业资讯：技术先导信号
    path: data/raw/wechat-mp
    license: 微信公众号公开内容，仅限研究使用，不二次分发全文
    time_range: [2025-03, 2026-08]
    ingestion_mode: backfill
    notes: AI 早报归档 697 篇 Markdown + jueya-index.csv 索引（权威元数据以索引为准）

  - id: jd-boss
    type: job_board              # boss直聘：标注素材（无发布日期）
    path: data/raw/jd/boss
    license: 平台公开页面，仅限研究使用，不分发原文
    time_range: [2026-08, 2026-08]
    ingestion_mode: backfill
    notes: OpenCLI 标签页 + mitm 网络层捕获；92 搜索 + 85 可用详情，明文薪资与技能标签

  - id: jd-51job-har
    type: job_board              # 51job 新采集（jdauto 通路）
    path: data/raw/jd/opencli
    license: 平台公开页面，仅限研究使用，不分发原文
    time_range: [2025-09, 2026-08]
    ingestion_mode: backfill
    notes: 远程浏览器 CDP 通路；386 搜索（六城）+ 237 详情，与 jd-opencli 同目录按文件区分（jd_har_*）

  - id: feeds
    type: rss_direct              # 24 个直连 RSS/Atom 源（清单见 data/FEEDS.yml）
    path: data/raw/feeds
    license: 各源公开 RSS/Atom，仅限研究使用，不二次分发全文
    time_range: [2015-12, 2026-08]
    ingestion_mode: live
    notes: 首期 24 源（优先级>=4 全量 + p2 精选），源自 rss2cubox feeds.txt [direct] 段；
      feedtest 2026-08-26 全部通过；guid 幂等追加，rssget 每 3 小时增量抓取

  - id: pypi-pkgstats
    type: package_registry       # PyPI/npm 包发布/下载：技术萌芽与采用信号
    path: data/raw/pypi
    license: PyPI JSON API、pypistats.org、BigQuery 公共数据集与 npm downloads API 公开数据，仅限研究使用
    time_range: [2006-02, 2026-08]
    ingestion_mode: backfill
    notes: 映射表 data/PKGS.yml v6（PyPI 160 包/19 域 + npm 24 包/5 域，npm 份额独立
      分母）。萌芽锚点 = pypi.org JSON API 全版本 upload_time；量级信号 = npm
      downloads/range API（2015 起全历史已拉）+ BigQuery Linehaul 2018 起月度下载
      （项目 hiro2-pypi-research，2026-08-28 额度被测试查询耗尽，9/1 重置后
      `scripts/pypidl.py hist` 拉取）。已死通路：pypistats 全端点仅 180 天、
      GitHub stargazers 端点 2026-06-30 起仅限仓库管理员
