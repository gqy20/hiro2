services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hiro2
      POSTGRES_USER: hiro2
      POSTGRES_PASSWORD: hiro2
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ./migrations/0002_review_quality.sql:/docker-entrypoint-initdb.d/0002_review_quality.sql:ro
      - ./migrations/0003_outbox.sql:/docker-entrypoint-initdb.d/0003_outbox.sql:ro
      - ./migrations/0004_career.sql:/docker-entrypoint-initdb.d/0004_career.sql:ro
      - ./migrations/0005_profile.sql:/docker-entrypoint-initdb.d/0005_profile.sql:ro
      - ./migrations/0006_temporal.sql:/docker-entrypoint-initdb.d/0006_temporal.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiro2 -d hiro2"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/hiro2password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://hiro2:hiro2@postgres:5432/hiro2
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: hiro2password
      # JD 快照：容器内 chromium 可用即启动周期采集（jdcorp Playwright headless）
      HIRO2_SNAPSHOT_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_USE_MOCK: "false"
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  neo4j-data:
