<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Hiro 品牌标志概念板</title>
  <desc id="desc">展示证据之桥 H 标志、构造方式、反白版本和产品应用</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#d8d1c5" stroke-width="1" opacity=".42"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#20201d" flood-opacity=".12"/>
    </filter>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}
      .mono{font-family:"IBM Plex Mono",Consolas,monospace}
      .label{font-size:15px;font-weight:600;fill:#77736b;letter-spacing:0}
      .rule{stroke:#cfc8bb;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#20201d"/>

  <!-- Cover -->
  <rect x="48" y="48" width="936" height="574" rx="4" fill="#f5f1e8"/>
  <text x="92" y="100" class="mono label">主标志 / 01</text>
  <g transform="translate(136 176) scale(2.28)">
    <path fill="#20201d" d="M16 14h30v34h12v32H46v34H16V14Zm96 0H82v34H70v32h12v34h30V14Z"/>
    <path fill="#e4b810" d="M56 46h16v36H56z"/>
  </g>
  <text x="442" y="410" class="sans" fill="#20201d" font-size="170" font-weight="600" letter-spacing="0">hiro</text>
  <line x1="92" y1="518" x2="940" y2="518" class="rule"/>
  <text x="92" y="562" class="sans" fill="#20201d" font-size="25" font-weight="600">让人与岗位，在可信证据上相遇。</text>
  <text x="940" y="562" text-anchor="end" class="mono" fill="#77736b" font-size="15">可信岗位版本</text>

  <!-- Dark reverse -->
  <rect x="1016" y="48" width="536" height="354" rx="4" fill="#151513" stroke="#363630"/>
  <text x="1056" y="100" class="mono label" fill="#aaa294">反白 / 02</text>
  <g transform="translate(1072 148) scale(1.38)">
    <path fill="#fffdf8" d="M16 14h30v34h12v32H46v34H16V14Zm96 0H82v34H70v32h12v34h30V14Z"/>
    <path fill="#e4b810" d="M56 46h16v36H56z"/>
  </g>
  <text x="1260" y="292" class="sans" fill="#fffdf8" font-size="102" font-weight="600">hiro</text>
  <circle cx="1492" cy="344" r="5" fill="#e4b810"/>
  <text x="1468" y="350" text-anchor="end" class="mono" fill="#aaa294" font-size="14">VERIFIED</text>

  <!-- App icon -->
  <rect x="1016" y="434" width="256" height="188" rx="4" fill="#e4b810"/>
  <text x="1048" y="476" class="mono label" fill="#5a4900">应用图标</text>
  <rect x="1086" y="495" width="116" height="116" rx="18" fill="#20201d" filter="url(#shadow)"/>
  <g transform="translate(1105 514) scale(.61)">
    <path fill="#fffdf8" d="M16 14h30v34h12v32H46v34H16V14Zm96 0H82v34H70v32h12v34h30V14Z"/>
    <path fill="#e4b810" d="M56 46h16v36H56z"/>
  </g>

  <!-- Mono -->
  <rect x="1304" y="434" width="248" height="188" rx="4" fill="#fffdf8"/>
  <text x="1336" y="476" class="mono label">单色版</text>
  <g transform="translate(1361 491) scale(.92)">
    <path fill="#20201d" d="M16 14h30v34h12v32H46v34H16V14Zm96 0H82v34H70v32h12v34h30V14Z"/>
    <path fill="#20201d" d="M56 46h16v36H56z"/>
  </g>

  <!-- Construction -->
  <rect x="48" y="654" width="504" height="398" rx="4" fill="#faf8f2"/>
  <rect x="48" y="654" width="504" height="398" rx="4" fill="url(#grid)"/>
  <text x="88" y="704" class="mono label">构造 / 03</text>
  <g transform="translate(150 734) scale(2.12)">
    <rect x="12" y="10" width="104" height="108" fill="none" stroke="#aaa294" stroke-width=".8" stroke-dasharray="3 3"/>
    <path fill="#20201d" d="M16 14h30v34h12v32H46v34H16V14Zm96 0H82v34H70v32h12v34h30V14Z"/>
    <path fill="#e4b810" d="M56 46h16v36H56z"/>
    <line x1="64" y1="2" x2="64" y2="126" stroke="#dc3c34" stroke-width=".8" opacity=".7"/>
    <line x1="4" y1="64" x2="124" y2="64" stroke="#2457e6" stroke-width=".8" opacity=".7"/>
  </g>
  <text x="88" y="1004" class="sans" fill="#20201d" font-size="18" font-weight="600">两侧轨道</text>
  <text x="220" y="1004" class="sans" fill="#77736b" font-size="18">候选人能力 / 岗位标准</text>
  <rect x="88" y="1022" width="16" height="4" fill="#e4b810"/>
  <text x="116" y="1030" class="sans" fill="#77736b" font-size="15">中央节点：审核后的可信连接</text>

  <!-- Product surface -->
  <rect x="584" y="654" width="968" height="398" rx="4" fill="#f5f1e8"/>
  <text x="624" y="704" class="mono label">产品应用 / 04</text>
  <rect x="624" y="742" width="888" height="260" rx="4" fill="#fffdf8" stroke="#cfc8bb"/>
  <rect x="624" y="742" width="888" height="58" rx="4" fill="#20201d"/>
  <g transform="translate(647 753) scale(.3)">
    <path fill="#fffdf8" d="M16 14h30v34h12v32H46v34H16V14Zm96 0H82v34H70v32h12v34h30V14Z"/>
    <path fill="#e4b810" d="M56 46h16v36H56z"/>
  </g>
  <text x="698" y="781" class="sans" fill="#fffdf8" font-size="26" font-weight="600">hiro</text>
  <text x="1468" y="778" text-anchor="end" class="sans" fill="#cfc8bb" font-size="14">岗位能力工作台</text>
  <text x="656" y="850" class="sans" fill="#20201d" font-size="26" font-weight="650">可信岗位版本</text>
  <rect x="1340" y="826" width="128" height="38" rx="4" fill="#e4b810"/>
  <text x="1404" y="851" text-anchor="middle" class="sans" fill="#20201d" font-size="15" font-weight="600">待审核 12</text>
  <line x1="656" y1="884" x2="1468" y2="884" class="rule"/>
  <text x="656" y="924" class="mono" fill="#77736b" font-size="14">JOB_VERSION_2026_08</text>
  <text x="1110" y="924" class="sans" fill="#20201d" font-size="16">证据 48</text>
  <text x="1226" y="924" class="sans" fill="#17824b" font-size="16">已确认 36</text>
  <text x="1362" y="924" class="sans" fill="#b18b00" font-size="16">待复核 12</text>
  <rect x="656" y="956" width="812" height="6" fill="#ded8cc"/>
  <rect x="656" y="956" width="609" height="6" fill="#20201d"/>

  <!-- Footer -->
  <text x="48" y="1082" class="mono" fill="#77736b" font-size="13">HIRO IDENTITY STUDY · CONCEPT A · 2026</text>
  <text x="1552" y="1082" text-anchor="end" class="mono" fill="#77736b" font-size="13">INK / SAFFRON / PAPER</text>
</svg>
