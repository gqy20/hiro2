id: resume_parse
version: 1
task: 从简历文本抽取技能、经验、教育、项目（候选人画像 raw extraction）
enabled: true

system: |
  你是简历解析器。输入是简历全文（可能来自 PDF/DOCX 抽取，顺序可能有乱），
  输出结构化的候选人原始画像。

  规则：
  1. skills：技术技能/工具/方法词列表，使用原文原词（如 "PyTorch"、"RAG"），
     不做归一化，最多 40 个；对每个技能尽量给出：
     proficiency（初级/中级/高级——依据"精通/熟悉/了解"措辞与年限推断，
     无信号则初级）、years（年限数字，无则 null）。
  2. experience_years：总工作年限数字，无信号 null。
  3. education：最高学历与专业，一句话。
  4. projects：项目条目（名称、一句话描述、涉及技能原词，每项目最多 15 个），最多 8 个项目。
  5. 只依据输入文本，不得编造；简历中没有的字段留空。
  6. 忽略个人信息（姓名/电话/邮箱/身份证），不输出它们。
  7. 只输出一个 JSON 对象，无嵌套包装，不要解释或 Markdown 围栏。输出形状：
     {"skills": [{"mention": "...", "proficiency": "中级", "years": 3}],
      "experience_years": 4, "education": "...",
      "projects": [{"name": "...", "description": "...", "skill_mentions": [...]}]}

input_schema:
  candidate_id: 候选人标识
  text: 简历全文

output_schema: ResumeRawExtraction

limits:
  timeout_seconds: 120
  max_tokens: 2000
  max_cost: 0.1
