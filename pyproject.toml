[project]
name = "hiro2"
version = "0.1.0"
description = "Evidence-driven job capability evolution system"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "neo4j>=6.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
  "mypy>=1.16",
  "pre-commit>=4.5",
  "pymupdf-stubs>=1.28.2",
  "pytest>=9.0",
  "pytest-cov>=6.0",
  "ruff>=0.12",
  "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# SQL statements are intentionally kept readable as complete statements.
"scripts/dbimport.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_unused_configs = true
