[project]
name = "hiro2"
version = "0.1.0"
description = "Evidence-driven job capability evolution system"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "mypy>=1.16",
  "pre-commit>=4.5",
  "pytest>=9.0",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_unused_configs = true
